[project]
name = "mcp-slim-proxy"
version = "0.2.0"
description = "MCP proxy that aggregates upstream MCP servers and re-advertises their tools with minified schemas to reduce LLM context spent on tool metadata"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
mcp-slim-proxy = "mcp_slim_proxy.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_slim_proxy"]
